<!doctype html><html><head><meta charset="utf-8"><title>T3 Komentar - Aman</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;line-height:1.5;background:#f6f7f9;color:#222}
.card{background:white;padding:22px;margin:18px 0;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button,select,textarea{padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:7px}
button{cursor:pointer;background:#222;color:white}.ok{color:#087a31}.bad{color:#a11}.mono{font-family:monospace;background:#f0f0f0;padding:3px 6px;border-radius:4px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:left}pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px}
</style>
</head>
<body><h1>T3 — Papan Komentar (AMAN)</h1><div class="card"><form id="f"><textarea id="c" placeholder="Tulis komentar" required></textarea><br><button>Kirim</button></form><p id="msg"></p></div>
<div class="card"><h2>Komentar tersimpan</h2><div id="list"></div></div>
<script>const data=[];f.onsubmit=e=>{e.preventDefault();data.push(c.value);c.value="";msg.textContent="Komentar disimpan sebagai teks.";render();};
function render(){list.textContent="";data.forEach((x,i)=>{const box=document.createElement("div");box.className="card";const b=document.createElement("b");b.textContent="Komentar #"+(i+1);const d=document.createElement("div");d.textContent=x;box.append(b,d);list.appendChild(box)})}</script></body></html>
