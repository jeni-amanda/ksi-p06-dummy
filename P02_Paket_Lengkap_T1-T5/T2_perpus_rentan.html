<!doctype html><html><head><meta charset="utf-8"><title>T2 Perpus - Rentan</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;line-height:1.5;background:#f6f7f9;color:#222}
.card{background:white;padding:22px;margin:18px 0;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button,select,textarea{padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:7px}
button{cursor:pointer;background:#222;color:white}.ok{color:#087a31}.bad{color:#a11}.mono{font-family:monospace;background:#f0f0f0;padding:3px 6px;border-radius:4px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:left}pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px}
</style>
</head>
<body><h1>T2 — Login Perpustakaan (RENTAN)</h1><div class="card">
<p>Akun demo: <span class="mono">petugas / Baca#2026</span></p>
<form id="f"><input id="u" placeholder="Username"><br><input id="p" placeholder="Password" type="password"><br><button>Login</button></form><p id="out"></p><h3>Kueri bentukan</h3><pre id="q"></pre></div>
<script>
const users=[{u:"petugas",p:"Baca#2026",role:"petugas"},{u:"anggota",p:"Anggota#2026",role:"anggota"}];
f.onsubmit=e=>{e.preventDefault();const query=`SELECT * FROM users WHERE username='${u.value}' AND password='${p.value}'`;q.textContent=query;
let ok=false; if(/'\s*OR\s*'[^']*'\s*=\s*'[^']*'/i.test(p.value)||/--/.test(p.value)) ok=true;
else ok=users.some(x=>x.u===u.value&&x.p===p.value);
out.innerHTML=ok?'<span class="ok">Login berhasil (simulasi)</span>':'<span class="bad">Login ditolak</span>';};</script></body></html>
