<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Diagnostik - Debug Active (Rentan)</title>
</head>
<body>
    <h2>Endpoint Diagnostik (Debug Mode: ON)</h2>
    <button onclick="runDiagnostics()">Jalankan Tes Diagnostik Error</button>

    <h3>Hasil Respons Server:</h3>
    <pre id="output"></pre>

    <script>
        function runDiagnostics() {
            // Simulasi response server saat DEBUG = true
            const debugResponse = {
                status: "500 Internal Server Error",
                debug_mode: true,
                error_trace: "Exception in module DB_CONNECT at line 42",
                env_vars: {
                    APP_ENV: "development",
                    SECRET_KEY: "secret_palsu_12345",
                    DATABASE_URL: "postgres://admin:password123@localhost:5432/db"
                }
            };
            
            document.getElementById("output").innerText = JSON.stringify(debugResponse, null, 2);
        }
    </script>
</body>
</html>
