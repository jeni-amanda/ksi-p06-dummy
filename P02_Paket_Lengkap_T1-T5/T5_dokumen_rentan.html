<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>T5 Dokumen - Rentan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
    }

    h1 {
      font-size: 36px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
    }

    select, input, button {
      padding: 12px;
      margin: 5px 0;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      min-height: 50px;
    }
  </style>
</head>

<body>

<h1>T5 — Portal Dokumen (RENTAN)</h1>

<div class="card">
  <p>
    Demo lokal: akses dokumen hanya berdasarkan ID.
  </p>

  <label>Sesi aktif:</label><br>

  <select id="currentUser">
    <option value="andi">andi</option>
    <option value="bela">bela</option>
  </select>

  <br><br>

  <label>ID Dokumen:</label><br>

  <input
    id="documentId"
    type="text"
    value="DOC-101"
  >

  <br>

  <!-- ID tombol dibuat unik -->
  <button id="btnOpenVulnerable">Buka</button>

  <div id="result">
    Belum ada dokumen yang dibuka.
  </div>
</div>

<script>
  const documents = [
    {
      id: "DOC-101",
      owner: "andi",
      title: "Laporan Keuangan Andi",
      content: "Dokumen rahasia milik Andi."
    },
    {
      id: "DOC-102",
      owner: "bela",
      title: "Data Anggaran Bela",
      content: "Dokumen rahasia milik Bela."
    }
  ];

  const userSelect = document.getElementById("currentUser");
  const documentInput = document.getElementById("documentId");
  const openButton = document.getElementById("btnOpenVulnerable");
  const resultBox = document.getElementById("result");

  openButton.addEventListener("click", function () {

    const requestedId = documentInput.value.trim();

    /*
      VULNERAN:
      Sistem hanya mencari dokumen berdasarkan ID.
      Tidak ada pemeriksaan owner.
    */

    const documentData = documents.find(
      function(doc) {
        return doc.id === requestedId;
      }
    );

    if (!documentData) {
      resultBox.textContent = "404 — Dokumen tidak ditemukan.";
      return;
    }

    resultBox.innerHTML =
      "<h3>" + documentData.title + "</h3>" +
      "<p>Pemilik: " + documentData.owner + "</p>" +
      "<p>" + documentData.content + "</p>" +
      "<p>Diakses oleh: " + userSelect.value + "</p>";
  });
</script>

</body>
</html>
