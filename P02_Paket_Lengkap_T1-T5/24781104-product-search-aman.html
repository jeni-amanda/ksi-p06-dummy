<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pencarian Produk - Aman</title>
</head>
<body>
    <h2>Pencarian Produk (Aman - Parameter Binding)</h2>
    <input type="text" id="searchInput" placeholder="Cari produk...">
    <button onclick="searchProduct()">Cari</button>

    <h3>Hasil:</h3>
    <ul id="results"></ul>

    <script>
        const products = [
            { id: 1, name: "Laptop Gaming" },
            { id: 2, name: "Mouse Wireless" },
            { id: 3, name: "Keyboard Mechanical" }
        ];

        function searchProduct() {
            const query = document.getElementById("searchInput").value;
            const resultsList = document.getElementById("results");
            resultsList.innerHTML = "";

            // Pengamanan: Input diperlakukan murni sebagai teks/literal (string matching biasa)
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(query.toLowerCase())
            );

            filteredProducts.forEach(product => {
                const li = document.createElement("li");
                li.textContent = product.name;
                resultsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
