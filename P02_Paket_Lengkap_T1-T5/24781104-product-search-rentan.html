<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pencarian Produk - Rentan</title>
</head>
<body>
    <h2>Pencarian Produk (Rentan Injection)</h2>
    <input type="text" id="searchInput" placeholder="Cari produk...">
    <button onclick="searchProduct()">Cari</button>

    <h3>Hasil:</h3>
    <ul id="results"></ul>

    <script>
        const products = [
            { id: 1, name: "Laptop Gaming" },
            { id: 2, name: "Mouse Wireless" },
            { id: 3, name: "Keyboard Mechanical" }
        ];

        function searchProduct() {
            const query = document.getElementById("searchInput").value;
            const resultsList = document.getElementById("results");
            resultsList.innerHTML = "";

            // Kerentanan: Menggunakan eval / pembuatan logika dinamis dari string masukan tanpa sanitasi
            products.forEach(product => {
                try {
                    // Simulasi gabungan string query yang rentan injection
                    if (query === "' OR '1'='1" || product.name.toLowerCase().includes(query.toLowerCase())) {
                        const li = document.createElement("li");
                        li.textContent = product.name;
                        resultsList.appendChild(li);
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
