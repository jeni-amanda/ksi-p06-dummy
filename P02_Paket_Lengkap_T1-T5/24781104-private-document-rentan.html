<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Otorisasi Objek Privat - Rentan</title>
</head>
<body>
    <h2>Akses Dokumen Privat (Rentan BOLA)</h2>
    <p>Logged in as: <b>User A (ID: 1)</b></p>
    <label>Masukkan ID Dokumen:</label>
    <input type="text" id="docId" value="102">
    <button onclick="getDoc()">Buka Dokumen</button>

    <h3>Konten Dokumen:</h3>
    <div id="content"></div>

    <script>
        const currentUser = { id: 1, name: "User A" };
        const documents = [
            { id: 101, ownerId: 1, content: "Dokumen Rahasia Milik User A" },
            { id: 102, ownerId: 2, content: "Dokumen Rahasia Milik User B" }
        ];

        function getDoc() {
            const id = parseInt(document.getElementById("docId").value);
            const doc = documents.find(d => d.id === id);
            
            // Rentan: Tidak ada pengecekan doc.ownerId === currentUser.id
            if (doc) {
                document.getElementById("content").innerText = doc.content;
            } else {
                document.getElementById("content").innerText = "Dokumen tidak ditemukan.";
            }
        }
    </script>
</body>
</html>
