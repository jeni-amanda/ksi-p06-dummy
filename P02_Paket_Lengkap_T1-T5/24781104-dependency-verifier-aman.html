<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Token Verifier - Aman (Upgraded)</title>
</head>
<body>
    <h2>Verifier Token (Komponen Hasil Upgrade)</h2>
    <label>Masukkan Token:</label><br>
    <input type="text" id="tokenInput" size="60" value="eyJhbGciOiJub25lIn0.eyJ1c2VyIjoiYWRtaW4ifQ.">
    <button onclick="verifyToken()">Verifikasi Token</button>

    <h3>Status Akses:</h3>
    <div id="result"></div>

    <script>
        function verifyToken() {
            const token = document.getElementById("tokenInput").value;
            const parts = token.split('.');

            // Simulasi komponen versi terbaru: Menolak token jika signature kosong atau alg = "none"
            const header = parts[0] ? atob(parts[0]) : "";
            const signature = parts[2];

            if (header.includes('"none"') || !signature || signature.trim() === "") {
                document.getElementById("result").style.color = "red";
                document.getElementById("result").innerText = "401 Unauthorized: Token ditolak! Token tanpa tanda tangan tidak diizinkan.";
            } else {
                document.getElementById("result").style.color = "green";
                document.getElementById("result").innerText = "200 OK: Token Valid";
            }
        }
    </script>
</body>
</html>
